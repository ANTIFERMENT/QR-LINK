# Resource-conservative Gradle settings for builds directly on Android.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.tooling.parallel=false
org.gradle.daemon=true
org.gradle.vfs.watch=false
org.gradle.console=plain
org.gradle.warning.mode=all
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true

# Avoid apparent hangs when one dependency repository cannot be reached.
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=20000
